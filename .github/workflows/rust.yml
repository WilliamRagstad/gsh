name: Rust Test

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Install dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y \
              protobuf-compiler cmake pkg-config libclang-dev \
              libxcb1-dev libxrandr-dev libdbus-1-dev \
              libpipewire-0.3-dev libwayland-dev wayland-protocols libdecor-0-dev \
              libegl-dev libgbm-dev libdrm-dev libgl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev \
              libx11-dev libxext-dev libxcursor-dev libxfixes-dev \
              libxi-dev libxss-dev libxtst-dev libasound2-dev libudev-dev
        - name: Set PKG_CONFIG_PATH environment variable
          run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
        - name: Set PROTOC environment variable
          run: echo "PROTOC=$(which protoc)" >> $GITHUB_ENV
        - name: Build
          run: cargo build --workspace --verbose
        - name: Run tests
          run: cargo test --workspace --verbose
        - name: Run benchmarks
          run: |
            cargo bench -p libgsh --bench libgsh_internals -- --quick
            cargo bench -p gsh-benchmarks --bench '*' -- --quick
        - name: Upload benchmark results
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: benchmark-results
            path: |
              target/criterion/
              libgsh/target/criterion/
              benches/target/criterion/
