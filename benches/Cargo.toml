[package]
name = "gsh-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false
# Register only implemented benchmarks; the other files are future placeholders.
autobenches = false

[[bench]]
name = "server_performance"
harness = false

[[bench]]
name = "frame_processing"
harness = false

[[bench]]
name = "authentication"
harness = false

[[bench]]
name = "integration_tests"
harness = false

[[bench]]
name = "webrtc_loopback"
harness = false
required-features = ["webrtc"]

[dependencies]
libgsh = { path = "../libgsh", default-features = false }
criterion = { workspace = true }
tokio-test = { workspace = true }
tokio = { version = "1.47", features = ["full"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
rand = "0.8"
reactor-webrtc = { version = "=0.22.1", optional = true }

[features]
default = []
webrtc = ["libgsh/webrtc", "dep:reactor-webrtc"]
