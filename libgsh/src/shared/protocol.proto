syntax = "proto3";
package protocol;

import "google/protobuf/empty.proto";

message ClientMessage {
	oneof client_event {
		ClientHello client_hello = 1;
		ClientAuth client_auth = 2;
		StatusUpdate status_update = 3;
		UserInput user_input = 4;
	}
}

message ServerMessage {
	oneof server_event {
		ServerHelloAck server_hello_ack = 1;
		ServerAuthAck server_auth_ack = 2;
		StatusUpdate status_update = 3;
		Frame frame = 4;
	}
}

message ClientHello {
	enum OS {
		UNKNOWN = 0;
		WINDOWS = 1;
		LINUX = 2;
		MACOS = 3;
		IOS = 4;
		ANDROID = 5;
		WEB = 6;
	}
	message MonitorInfo {
		uint32 monitor_id   = 1;
		int32  x            = 2;
		int32  y            = 3;
		uint32 width        = 4;
		uint32 height       = 5;
		uint32 refresh_hz   = 6; // Hertz
	}
	uint32 protocol_version = 1;
	OS os = 2;
	string os_version = 3;
	repeated MonitorInfo monitors = 4;
}

message ServerHelloAck {
	enum FrameFormat {
		RGB = 0;
		RGBA = 1;
	}
	FrameFormat format = 1;
	oneof compression {
		ZstdCompression zstd = 2;
	}
	message ZstdCompression {
		int32 level = 1;
	}
	message WindowSettings {
		enum WindowMode {
			FULLSCREEN = 0;
			BORDERLESS = 1;
			WINDOWED = 2;
			WINDOWED_MAXIMIZED = 3;
		}
		uint32 window_id = 1;
		optional uint32 monitor_id = 2;
		WindowMode initial_mode = 3;
		uint32 width = 4;
		uint32 height = 5;
		string title = 6;
		bool always_on_top = 7;
		bool allow_resize = 8;
		// Scale frames to fit a resized window when allow_resize is enabled.
		bool resize_frame = 9;
		enum WindowAnchor {
			TOP_LEFT = 0;
			CENTER = 1;
		}
		WindowAnchor frame_anchor = 10;
	}
	repeated WindowSettings windows = 3;
	oneof auth_method {
		google.protobuf.Empty password = 4;
		SignatureMethod signature = 5;
	}
	message SignatureMethod {
		bytes sign_message = 1; // Authentication challenge to sign
	}
}

message ClientAuth {
	oneof auth_data {
		Password password = 1;
		Signature signature = 2;
	}
	message Password {
		string password = 1;
	}
	message Signature {
		bytes signature = 1;
		bytes public_key = 2;
	}
}

message ServerAuthAck {
	enum AuthStatus {
		SUCCESS = 0;
		FAILURE = 1;
	}
	AuthStatus status = 1;
	string message = 2;
}

message StatusUpdate {
	enum StatusType {
		INFO = 0;
		WARNING = 1;
		ERROR = 2;
		EXIT = 3;
	}
	StatusType kind = 1;
	oneof details {
		Info info = 2;
		Warning warning = 3;
		Error error = 4;
	}
	message Info {
		string message = 1;
	}
	message Warning {
		string message = 1;
		int32 code = 2;
	}
	message Error {
		string message = 1;
		int32 code = 2;
	}
}

message UserInput {
	enum InputType {
		KEY_EVENT = 0;
		MOUSE_EVENT = 1;
		WINDOW_EVENT = 2;
	}
	InputType kind = 1;
	uint32 window_id = 2;
	oneof input_event {
		KeyEvent key_event = 3;
		MouseEvent mouse_event = 4;
		WindowEvent window_event = 5;
	}
	message KeyEvent {
		enum KeyAction {
			PRESS = 0;
			RELEASE = 1;
		}
		KeyAction action = 1;
		int32 key_code = 2;
		uint32 modifiers = 3;
	}
	message MouseEvent {
		enum MouseAction {
			MOVE = 0;
			PRESS = 1;
			RELEASE = 2;
			SCROLL = 3;
			ENTER = 4;
			EXIT = 5;
		}
		MouseAction action = 1;
		enum MouseButton {
			LEFT = 0;
			RIGHT = 1;
			MIDDLE = 2;
		}
		int32 button = 2;
		int32 x = 3;
		int32 y = 4;
		float delta_x = 5; // Scroll deltas
		float delta_y = 6;
		// True when delta_x/delta_y carry relative pointer movement, not scroll.
		bool relative = 7;
	}
	message WindowEvent {
		enum WindowAction {
			RESIZE = 0;
			MOVE = 1;
			CLOSE = 2;
			MINIMIZE = 3;
			MAXIMIZE = 4;
			FULLSCREEN = 5;
			UNFULLSCREEN = 6;
			FOCUS = 7;
			UNFOCUS = 8;
		}
		WindowAction action = 1;
		int32 x = 2;
		int32 y = 3;
		uint32 width = 4;
		uint32 height = 5;
	}
}

message Frame {
	uint32 window_id = 1;
	uint32 width = 2;
	uint32 height = 3;
	message Segment {
		int32 x = 1;
		int32 y = 2;
		uint32 width = 3;
		uint32 height = 4;
		bytes data = 5; // Pixel bytes, compressed if negotiated
	}
	repeated Segment segments = 4;
}
