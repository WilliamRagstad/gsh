[package]
name = "gsh"
version = "1.0.0"
edition = "2021"

[dependencies]
libgsh = { workspace = true, features = ["webrtc"] }
reactor-webrtc = "=0.22.1"
clap = { version = "4.5.35", features = ["derive"] }
webpki-roots = "0.26.8"
rustls-native-certs = "0.8.4"
sdl3 = { version = "0.17.3", features = [
	"build-from-source",
	"static-link",
	"image",
] }
log = "0.4.27"
env_logger = "0.11.8"
anyhow = "1.0.97"
futures-util = "0.3"
os_info = "3.14"
tokio = { version = "1.44.2", features = ["full"] }
tokio-rustls = { version = "0.26.2", features = ["ring"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls-pemfile = "2"
serde_json = "1.0.140"
prost = "0.13.5"
homedir = "0.3.4"
serde = "1.0.219"
dialoguer = "0.11.0"
rand = "0.9.1"

[dev-dependencies]
tempfile = "3"
